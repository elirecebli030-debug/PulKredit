  <title>Ödəniş Et - CoinPayments</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    
    body {
      min-height: 100vh;
      background: #070b14;
      display: flex; 
      align-items: center; 
      justify-content: center; 
      padding: 20px;
      color: #fff;
    }

    .card {
      max-width: 450px; 
      width: 100%;
      background: #0c1421;
      border-radius: 24px;
      box-shadow: 0 40px 100px -20px rgba(0,0,0,0.9), 0 0 0 1px rgba(255,255,255,0.05);
      padding: 40px 30px;
      text-align: center;
      position: relative;
    }

    .brand-name { 
      font-size: 24px; 
      font-weight: 800; 
      margin-bottom: 20px; 
      letter-spacing: -0.5px;
    }
    .brand-name span { color: #f7931a; }

    .price-display {
      font-size: 48px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 30px;
      letter-spacing: -2px;
    }
    .price-display span { color: #f7931a; font-size: 32px; }

    .form-container {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    /* Düymənin özünü bir az böyüdürük ki, gözəl görünsün */
    .form-container input[type="image"] {
      width: 100% !important;
      max-width: 280px;
      border-radius: 12px;
      transition: transform 0.2s;
      cursor: pointer;
    }
    
    .form-container input[type="image"]:hover {
      transform: translateY(-2px);
    }

    .note {
      font-size: 12px;
      color: #6b8099;
      margin-top: 20px;
      line-height: 1.5;
    }
  </style>
</head>
